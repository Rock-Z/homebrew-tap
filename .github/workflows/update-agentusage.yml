name: Update AgentUsage cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-agentusage-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update cask from the latest AgentUsage release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release="$(
            gh release view \
              --repo Rock-Z/AgentUsage \
              --json tagName,assets
          )"
          tag="$(jq -r '.tagName' <<<"$release")"
          version="${tag#v}"
          digest="$(
            jq -r '
              .assets[]
              | select(.name == "AgentUsage-macos-universal.dmg")
              | .digest
            ' <<<"$release"
          )"
          sha256="${digest#sha256:}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]

          ruby - "Casks/agentusage.rb" "$version" "$sha256" <<'RUBY'
          path, version, sha256 = ARGV
          cask = File.read(path)
          cask.sub!(/^  version ".*"$/, %(  version "#{version}"))
          cask.sub!(/^  sha256 ".*"$/, %(  sha256 "#{sha256}"))
          File.write(path, cask)
          RUBY

          if git diff --quiet -- Casks/agentusage.rb; then
            echo "AgentUsage cask is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/agentusage.rb
          git commit -m "Update AgentUsage to $version"
          git push
